# Настройки для хостинга Render (render.com): сайт и сервер по одной общей ссылке
services:
  - type: web
    name: sosedi
    runtime: python
    plan: free
    region: frankfurt   # рядом с базой Neon (тоже Франкфурт)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: Europe/Moscow
      - key: PUBLIC_URL
        value: https://sosedi.onrender.com   # куда ЮKassa возвращает после оплаты
      - key: DATABASE_URL
        sync: false   # адрес базы Neon вставляем руками в настройках Render
      - key: YOOKASSA_SHOP_ID
        sync: false   # shopId магазина ЮKassa
      - key: YOOKASSA_SECRET_KEY
        sync: false   # секретный ключ ЮKassa (тестовый начинается с test_)
